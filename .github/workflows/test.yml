name: selftest

on: [push, pull_request]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (hardware-free test needs numpy only)
        run: pip install numpy
      - name: Protocol self-test (no hardware)
        run: python -m aula selftest
        working-directory: src
